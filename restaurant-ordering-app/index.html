<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="app-container">
            <header>
                <div class="main-title">
                    <h1>Jimmy's Diner</h1>
                    <h2>The best burgers and pizzas in town.</h2>
                </div>
            </header>

            <section id="menu-section">
            </section>
            <section id="order-section">
            </section>
            <section id="order-summary">
            </section>
        </div>
        <!-- The Modal Dialog -->
        <dialog id="card-details-modal">
            <div class="modal-content">
                <h2>Enter card details</h2>
                <form id="card-details-form">
                    <input id="card-name" placeholder="Enter your name" type="text" required>
                    <input id="card-number" placeholder="Enter card number" type="number" required>
                    <input id="card-cvv" placeholder="Enter CVV" type="number" required>
                    <button id="pay-btn" type="submit">Pay</button>
                </form>
            </div>
        </dialog>
	<script src="index.js" type="module"></script>
    </body>
</html>
