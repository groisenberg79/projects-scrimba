<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <img class="logo" src="images/logo.png" alt="oldagram logo">
                <img class="user-avatar" src="images/user-avatar.png" alt="user avatar">
            </header>

            <section>
                <div class="section-header">
                    <img class="artist-avatar" src="images/avatar-vangogh.jpg" alt="avatar of van gogh">
                    <div class="avatar-info">
                        <p class="artist-name">Vincent van Gogh</p>
                        <p class="artist-home">Zudert, Netherlands</p>
                    </div>
                </div>
                <img class="self-portrait" src="images/post-vangogh.jpg" alt="self-portrait of van gogh">
            </section>
            <footer>
                <div class="footer-icons">
                    <img src="images/icon-heart.png" alt="heart icon">
                    <img src="images/icon-comment.png" alt="comment icon">
                    <img src="images/icon-dm.png" alt="dm icon">
                </div>
                <p class="likes"> 21,492 likes</p>
                <p> <span class="artist-name">vincey1853</span> just took a few mushrooms lol</p>
            </footer>
            <script src="index.js"></script>
        </div>
    </body>
</html>
